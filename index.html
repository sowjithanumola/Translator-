<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swetha's Translator ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins', sans-serif;
  background: linear-gradient(135deg, #8ab4ff, #c0d8ff);
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:90%;
  max-width:650px;
  background:#ffffffee;
  padding:25px;
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,0.15);
  animation: fadeIn 1s;
}

@keyframes fadeIn {
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

h2{
  text-align:center;
  color:#1a237e;
  font-size:28px;
  margin-bottom:10px;
}

.creator{
  text-align:center;
  color:#374151;
  font-size:14px;
  margin-bottom:15px;
  font-style:italic;
}

textarea{
  width:100%;
  height:140px;
  padding:12px;
  border-radius:10px;
  border:2px solid #a5b4fc;
  font-size:16px;
  outline:none;
  transition:0.3s;
}

textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 8px #2563eb66;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  font-size:18px;
  background:linear-gradient(135deg, #1e40af, #2563eb);
  border:none;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

.copy-btn{
  background:#10b981 !important;
}
.copy-btn:hover{
  background:#0ea769 !important;
}

.mic-btn{
  background:#ef4444 !important;
  font-size:20px;
}
.mic-btn.active{
  background:#dc2626 !important;
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}
  70%{box-shadow:0 0 0 10px rgba(220,38,38,0)}
  100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}
}

.output{
  margin-top:15px;
  padding:15px;
  min-height:80px;
  background:#eef2ff;
  border-radius:12px;
  font-size:17px;
}

.status{
  text-align:center;
  margin-top:8px;
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<div class="card">
<h2>🌐 Telugu ↔ English Translator</h2>
<div class="creator">✨ Created for Swetha ✨</div>

<textarea id="input" placeholder="Type or Speak Telugu/English..."></textarea>

<button class="mic-btn" id="micBtn" onclick="startVoice()">🎤 Speak Telugu</button>

<button onclick="translateText()">Translate</button>

<div class="output" id="output">Your translation will appear here</div>
<button class="copy-btn" onclick="copyText()">📋 Copy Translation</button>

<div class="status" id="status">Ready ✅</div>
</div>

<script>
// ✅ Translation Function
async function translateText(){
  const text=document.getElementById("input").value.trim();
  if(!text) return alert("Please type or speak something!");

  const output=document.getElementById("output");
  const status=document.getElementById("status");

  output.textContent="Translating... ⏳";
  status.textContent="Please wait…";

  const teluguCheck=/[\u0C00-\u0C7F]/.test(text);
  const from=teluguCheck?"te":"en";
  const to=teluguCheck?"en":"te";

  try{
    const res=await fetch("https://lingva.ml/api/v1/"+from+"/"+to+"/"+encodeURIComponent(text));
    if(!res.ok) throw new Error("Server Error: "+res.status);

    const data=await res.json();
    output.textContent=data.translation || "No translation found";
    status.textContent="Done ✅";
  }catch(err){
    output.textContent="❌ Error! Try again later";
    status.textContent=err.message;
  }
}

// ✅ Copy Button Function
function copyText(){
  const text=document.getElementById("output").textContent;
  if(!text || text.includes("Translation") || text.includes("Error")){
    alert("Nothing to copy!");
    return;
  }
  navigator.clipboard.writeText(text);
  alert("Copied ✅");
}

// ✅ Voice Input Telugu
const micBtn=document.getElementById("micBtn");
let recognition;
if('webkitSpeechRecognition' in window){
  recognition=new webkitSpeechRecognition();
  recognition.lang="te-IN"; 
  recognition.continuous=false;
  recognition.interimResults=false;

  recognition.onresult=function(event){
    document.getElementById("input").value=event.results[0][0].transcript;
  };

  recognition.onstart=()=>{micBtn.classList.add("active");micBtn.textContent="🎙 Listening...";};
  recognition.onend=()=>{micBtn.classList.remove("active");micBtn.textContent="🎤 Speak Telugu";};
}

function startVoice(){
  if(!recognition) return alert("Voice not supported in this browser!");
  recognition.start();
}
</script>

</body>
</html>
